name: build-item-consolidator-v0.6.2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v0.6.2 source patch
        shell: pwsh
        run: |
          python -c "from pathlib import Path; Path('v062.patch').write_bytes(b''.join(x.read_bytes() for x in sorted(Path('ci/v0.6.2').glob('patch.part*'))))"
          git apply --check v062.patch
          git apply v062.patch
      - name: Verify v0.6.2 counter-test scope
        run: python tools/verify_v062_logic.py
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Route logic self-test
        run: .\build\Release\route_logic_tests.exe
      - name: Rotation logic self-test
        run: .\build\Release\rotation_logic_tests.exe
      - name: Shared coordinator self-test
        run: .\build\Release\trade_coordinator_logic_tests.exe
      - name: Dungeon death-counter self-test
        run: .\build\Release\dungeon_logic_tests.exe
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build\Release\ThanLongItemConsolidator.exe stage\ThanLongItemConsolidator_v0.6.2.exe
          Copy-Item build\Release\ThanLongCleanRouteBridge.dll stage\ThanLongCleanRouteBridge.dll
          Copy-Item README.md,PROJECT_KNOWLEDGE.md,CHANGELOG.md,VERSION.txt,SOURCE_PROVENANCE.md,BUILD_STATUS.md,TOOL_LOGIC_TABLE.html stage\
          Copy-Item -Recurse docs,features stage\
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v0.6.2-win-x64
          path: stage
          if-no-files-found: error
